<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHATHU-MD Facebook Downloader</title>

<style>
body{
font-family: Arial, sans-serif;
background: linear-gradient(270deg,#ff4e50,#fc913a,#f9d423,#24c6dc);
background-size:800% 800%;
animation: gradient 10s ease infinite;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

@keyframes gradient{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
background:white;
padding:40px;
border-radius:15px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
animation: fadeIn 1.5s;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

h1{
color:#ff4e50;
margin-bottom:20px;
}

input{
width:80%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
margin-bottom:15px;
}

button{
padding:12px 25px;
border:none;
border-radius:8px;
background:#ff4e50;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#ff2a2a;
transform:scale(1.05);
}

.result{
margin-top:20px;
}

footer{
position:absolute;
bottom:10px;
font-size:12px;
color:white;
}
</style>
</head>

<body>

<div class="container">
<h1>CHATHU-MD</h1>
<p>Facebook Video Downloader</p>

<input type="text" id="url" placeholder="Paste Facebook Video URL">
<br>
<button onclick="downloadVideo()">Download</button>

<div class="result" id="result"></div>
</div>

<footer>Developed by chathu-md cmt</footer>

<script>
function downloadVideo(){
let url = document.getElementById("url").value;

if(url==""){
alert("Please paste Facebook video link");
return;
}

document.getElementById("result").innerHTML =
"<p style='color:green;'>Processing video...</p>";

setTimeout(()=>{
document.getElementById("result").innerHTML =
"<a href='"+url+"' target='_blank'>Click here to open video</a>";
},2000);

}
</script>

</body>
</html>
